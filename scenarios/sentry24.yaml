# RM Vision Sim - 2024/2025 sentry ego model scenario.
#
# Uses the simplified CAD sentry (`assets/robots/sentry24/24sentry_simplified.glb`,
# `ego.model: sentry24`, ~160 k triangles / 7.5 MB instead of the 144 MB source
# assembly). The asset follows the ego model contract; see
# `tools/build_sentry_glb.py` and `config/ego/sentry24.yaml`.
#
# Run:  godot --path . -- --scenario=res://scenarios/sentry24.yaml

schema_version: 1
name: sentry24
field: flat
ros:
  backend: rclgd
  raw_encoding: rgb8
  raw_hz: 30.0
  compressed_hz: 60.0
  jpeg_quality: 90
  enabled: true
camera:
  preset: qyg
  yaw_offset_deg: 0.0
  fpv_fov_deg: 70.0
ego:
  model: sentry24
  position: [0.0, 0.0, 2.2]
  yaw_deg: 0.0
targets:
  - id: t1
    team: red
    armor: small
    number: "3"
    position: [0.0, 0.0, -1.4]
    yaw_deg: 180.0
    motion:
      type: static
      mode: once
  - id: t2
    team: blue
    armor: large
    number: "1"
    position: [1.6, 0.0, -0.6]
    yaw_deg: 235.0
    motion:
      type: static
      mode: once
