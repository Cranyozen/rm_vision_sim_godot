# Ego model profile: minimal generated debug robot.
#
# Tiny box robot (`tools/make_debug_robot.py`) for camera / feed / ROS
# debugging. It already follows the standard frame (authored level on the
# ground) and ships GIMBAL / CAM_DIRECTION / SHOT_DIRECTION, so the defaults
# cover everything: no scale, floor offset, install-pitch compensation or
# camera override is needed (schema version 2, see docs/EGO_MODEL_CONTRACT.md).

schema_version: 2
id: debug
display_name: Debug box robot

asset:
  path: res://assets/robots/debug/debug_robot.glb
