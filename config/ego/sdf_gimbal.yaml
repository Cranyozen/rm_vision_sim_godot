# Ego model profile: Phase 5 sample SDF robot.
#
# Same kinematic chain as `robot.urdf` but authored as SDF 1.7 (link poses are
# relative to the model frame, joint poses relative to the child link). Used to
# prove that both loaders feed the same `RobotRig` path and the same camera/TF
# chain.
#
# Run: godot --path . -- --scenario=res://scenarios/phase5_sdf.yaml

schema_version: 1
id: sdf_gimbal
display_name: SDF sample gimbal

scene_path: ""
unit_scale: 1.0
floor_offset_m: 0.0

gimbal_node: ""
gimbal_yaw_node: ""

robot_description:
  format: sdf
  path: res://assets/robots/phase5_gimbal/robot.sdf
  yaw_joint: gimbal_yaw_joint
  pitch_joint: gimbal_pitch_joint
  camera_link: camera_link
  camera_optical_frame: camera_optical_frame

