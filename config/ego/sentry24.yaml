# Ego model profile: 2024/2025 sentry, simplified CAD export.
#
# Source: 24哨兵-总装.glb (full Onshape assembly, 3.1 M instanced triangles,
# 144 MB).  `tools/build_sentry_glb.py` drops fasteners/bearings/electronics,
# un-poses the head (the CAD head is authored yawed 46 deg and pitched 24.4 deg
# up), merges the chassis and head into two meshes, decimates to ~160 k
# triangles and rebuilds the contract node tree:
#
#   SENTRY24
#   ├─ BASE ─ CHASSIS                # chassis + wheels + armour, origin on the ground
#   └─ GIMBAL                        # pivot: big-yaw axis at the pitch-axis height
#      ├─ GIMBAL_MAIN                # head/hopper/launcher, authored level
#      ├─ CAM_DIRECTION              # aim-camera lens, gimbal space
#      └─ SHOT_DIRECTION             # muzzle
#
# The asset is authored to the contract (metres, +Y up, -Z forward, origin at
# the chassis centre on the ground, eye level), so no scale/offset/install-pitch
# compensation is needed.

schema_version: 1
id: sentry24
display_name: Sentry 24 (simplified CAD)

scene_path: res://assets/robots/sentry24/24sentry_simplified.glb
unit_scale: 1.0
floor_offset_m: 0.0

# Two joints, two axes: the big-yaw bearing (vertical) and the small-gimbal
# pitch bearing (horizontal, offset from the yaw axis).  `GIMBAL_YAW` holds the
# yaw platform (hopper, dial, yaw hardware) and `GIMBAL` the pitching launcher
# head, so the rig yaws and pitches about the real axes instead of collapsing
# both into one pivot.
gimbal_yaw_node: GIMBAL_YAW
gimbal_node: GIMBAL
gimbal_rest_pitch_deg: 0.0
gimbal_visual_offset_m: [0.0, 0.0, 0.0]
marker_nodes: [CAM_DIRECTION, SHOT_DIRECTION]
camera_marker_node: CAM_DIRECTION

# Eye position in gimbal space (same value as the asset's CAM_DIRECTION node);
# used only if the marker is missing.
camera_mount_fallback_m: [-0.033585, 0.018609, -0.191025]
